name: METADAT Pipeline

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run mode (no release)'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      entries: ${{ steps.version-check.outputs.entries }}
      artifacts: ${{ steps.version-check.outputs.artifacts }}
      skip_reason: ${{ steps.version-check.outputs.skip_reason }}
      skip: ${{ steps.version-check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Check for updates (version check)
        id: version-check
        run: |
          echo "Checking for updates..."
          # Source-specific version check logic would go here
          echo "version=2026-04-10" >> $GITHUB_OUTPUT
          echo "entries=380" >> $GITHUB_OUTPUT
          echo "artifacts=3" >> $GITHUB_OUTPUT
          echo "skip_reason=Already on latest version" >> $GITHUB_OUTPUT
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Send Discord notification (started)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          node dist/core/notify.js started no-intro

      - name: Send Discord notification (skipped)
        if: steps.version-check.outputs.skip == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_VERSION: ${{ steps.version-check.outputs.version }}
          PIPELINE_SKIP_REASON: ${{ steps.version-check.outputs.skip_reason }}
        run: |
          node dist/core/notify.js skipped no-intro

      - name: Send Discord notification (success)
        if: steps.version-check.outputs.skip == 'false' && success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_VERSION: ${{ steps.version-check.outputs.version }}
          PIPELINE_ENTRIES: ${{ steps.version-check.outputs.entries }}
          PIPELINE_ARTIFACTS: ${{ steps.version-check.outputs.artifacts }}
        run: |
          node dist/core/notify.js success no-intro

      - name: Send Discord notification (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_ERROR: ${{ steps.version-check.outputs.error }}
        run: |
          node dist/core/notify.js failure no-intro