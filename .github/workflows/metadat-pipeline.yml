name: METADAT Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run mode (no release)'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # === SETUP ===
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # === NOTIFY STARTED (curl) ===
      - name: Notify started
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"⏩ No-Intro Pipeline Started\",\"description\":\"Fetching latest DATs from Dat-o-Matic...\",\"color\":16776960,\"url\":\"$GITHUB_SERVER_URL/Mesh-ARKade/metadat-nointro/actions/runs/$GITHUB_RUN_ID\",\"footer\":{\"text\":\"Mesh-ARKade/metadat-nointro\"}}]}"

      # === BUILD ===
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build TypeScript
        run: npm run build

      # === PIPELINE PHASES ===
      - name: Phase 1 - Fetch DATs
        env:
          GITHUB_OWNER: Mesh-ARKade
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase fetch

      - name: Phase 2 - Group DATs
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase group

      - name: Phase 3 - Train Dictionary
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase dict || echo "Dictionary skipped"

      - name: Phase 4 - Create JSONL
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase jsonl

      - name: Phase 5 - Compress
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase compress

      - name: Phase 6 - Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPO: metadat-nointro
        run: node dist/scripts/pipeline-phase.js --source no-intro --phase release

      # === UPLOAD ARTIFACTS ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/*.jsonl.zst
            output/manifest.json

      # === NOTIFY RESULT (node) ===
      - name: Notify success (node)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node dist/core/notify.js success no-intro || true

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PIPELINE_ERROR: "Pipeline failed"
        run: node dist/core/notify.js failure no-intro || true