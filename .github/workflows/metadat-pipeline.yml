name: METADAT Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run mode (no release)'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # Setup
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Build TypeScript
        run: npm run build

      # Run pipeline
      - name: Run pipeline
        env:
          GITHUB_OWNER: Mesh-ARKade
          GITHUB_REPO: metadat-nointro
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
            node dist/core/pipeline.js --dry-run --source no-intro || true
          else
            node dist/core/pipeline.js --source no-intro || true
          fi

      # Upload artifacts
      - name: Send started notification
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          node dist/core/notify.js started no-intro || true

      # Send success notification (if entire job succeeds)
      - name: Send success notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_VERSION: '2026-04-10'
          PIPELINE_ENTRIES: '380'
          PIPELINE_ARTIFACTS: '3'
        run: |
          node dist/core/notify.js success no-intro || true

      # Send failure notification (if job fails)
      - name: Send failure notification
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_ERROR: 'Pipeline failed - check logs'
        run: |
          node dist/core/notify.js failure no-intro || true