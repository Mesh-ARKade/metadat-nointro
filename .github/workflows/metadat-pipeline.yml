name: METADAT Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run mode (no release)'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # === SETUP ===
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # === NOTIFY STARTED (curl - node not ready yet) ===
      - name: Notify started
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"⏩ No-Intro Pipeline Started\",\"description\":\"Fetching latest DATs from Dat-o-Matic...\",\"color\":16776960,\"url\":\"$GITHUB_SERVER_URL/Mesh-ARKade/metadat-nointro/actions/runs/$GITHUB_RUN_ID\",\"footer\":{\"text\":\"Mesh-ARKade/metadat-nointro\"}}]}"

      # === BUILD ===
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build TypeScript
        run: npm run build

      # === PIPELINE STAGES (each is separate step) ===
      - name: Stage 1 - Fetch DATs
        run: node dist/core/pipeline.js --source no-intro --stage fetch || echo "fetch_failed=true" >> $GITHUB_STEP_OUTPUT
        continue-on-error: true
        env:
          GITHUB_STEP_OUTPUT: /tmp/stage_result.txt

      - name: Stage 2 - Group DATs
        run: |
          if grep -q "fetch_failed" /tmp/stage_result.txt 2>/dev/null; then echo "SKIPPED: fetch failed"; else node dist/core/pipeline.js --source no-intro --stage group || echo "group_failed=true" >> /tmp/stage_result.txt; fi
        continue-on-error: true

      - name: Stage 3 - Train Dictionary
        run: |
          if grep -q "group_failed" /tmp/stage_result.txt 2>/dev/null; then echo "SKIPPED: group failed"; else node dist/core/pipeline.js --source no-intro --stage dict || echo "dict_failed=true" >> /tmp/stage_result.txt; fi
        continue-on-error: true

      - name: Stage 4 - Create JSONL
        run: |
          if grep -q "dict_failed" /tmp/stage_result.txt 2>/dev/null; then echo "SKIPPED: dict failed"; else node dist/core/pipeline.js --source no-intro --stage jsonl || echo "jsonl_failed=true" >> /tmp/stage_result.txt; fi
        continue-on-error: true

      - name: Stage 5 - Compress to ZST
        run: |
          if grep -q "jsonl_failed" /tmp/stage_result.txt 2>/dev/null; then echo "SKIPPED: jsonl failed"; else node dist/core/pipeline.js --source no-intro --stage compress || echo "compress_failed=true" >> /tmp/stage_result.txt; fi
        continue-on-error: true

      - name: Stage 6 - Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "compress_failed" /tmp/stage_result.txt 2>/dev/null; then echo "SKIPPED: compress failed"; else node dist/core/pipeline.js --source no-intro --stage release; fi
        continue-on-error: true

      # === UPLOAD ARTIFACTS ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/*.jsonl.zst
            output/manifest.json
        continue-on-error: true

      # === NOTIFY RESULT (use node script - rich embeds) ===
      - name: Notify success (node)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PIPELINE_VERSION: '2026-04-10'
        run: |
          node dist/core/notify.js success no-intro || true

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          node dist/core/notify.js failure no-intro || true